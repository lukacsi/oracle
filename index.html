<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Magyar Jósda — oracle.gyoma.org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>A Magyar Jósda</h1>
    <p class="subtitle">— minden kérdésedre egy szólás a válasz —</p>
    <div class="orb" id="orb"></div>
    <div class="question-box">
      <input type="text" id="question" placeholder="Mi gyötör téged, vándor?" autocomplete="off" maxlength="200">
    </div>
    <button class="ask-btn" id="askBtn">Kérdezd a Jósdát</button>
    <div class="answer" id="answer"></div>
    <button class="again-btn" id="againBtn">még egy kérdés...</button>
    <footer id="footer">oracle.gyoma.org</footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
