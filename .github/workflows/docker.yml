name: docker

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Export image tag
        id: image-tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lukacsi/oracle
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homelab-bump:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homelab
        uses: actions/checkout@v4
        with:
          repository: lukacsi/homelab
          token: ${{ secrets.HOMELAB_DEPLOY_PAT }}
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump oracle image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          sed -i "s|ghcr.io/lukacsi/oracle:[a-z0-9-]*|ghcr.io/lukacsi/oracle:${IMAGE_TAG}|" \
            k8s/workload-apps/oracle/manifests/deployment.yaml
          echo "=== Updated image line:"
          grep 'image:' k8s/workload-apps/oracle/manifests/deployment.yaml

      - name: Commit, rebase on latest, push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git add k8s/workload-apps/oracle/manifests/deployment.yaml
          git commit -m "chore(oracle): bump image to ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
